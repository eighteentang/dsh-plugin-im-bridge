<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="IM Bridge">
  <defs>
    <linearGradient id="imb-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18a97b"/>
      <stop offset="1" stop-color="#128f9e"/>
    </linearGradient>
  </defs>
  <!-- 底：圆角方块 -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#imb-tile)"/>
  <!-- 手机侧的对话气泡（左上） -->
  <path d="M15 16h17a4 4 0 0 1 4 4v9a4 4 0 0 1-4 4h-8l-5 5v-5h-4a4 4 0 0 1-4-4v-9a4 4 0 0 1 4-4z" fill="#ffffff"/>
  <!-- 电脑侧的对话气泡（右下，描边以示"另一个端"） -->
  <path d="M32 31h17a4 4 0 0 1 4 4v9a4 4 0 0 1-4 4h-4v5l-5-5h-8a4 4 0 0 1-4-4v-9a4 4 0 0 1 4-4z"
        fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round"/>
  <!-- 中间那条"桥"：连接两端 -->
  <circle cx="26.5" cy="27.5" r="3.2" fill="#ffffff"/>
  <circle cx="37.5" cy="36.5" r="3.2" fill="#ffffff"/>
  <path d="M28.6 30.6l6.8 3.8" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>
